---
layout: default
---

<article class="post">
  <img class="post-hero" src="{{ page.image | default: '/assets/images/post-placeholder.svg' | relative_url }}" alt="{{ page.image_alt }}">

  <header class="post-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
    <h2>{{ page.title }}</h2>
  </header>

  {{ content }}

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
