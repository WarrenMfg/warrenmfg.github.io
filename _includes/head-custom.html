<!-- Overrides Midnight's head-custom.html; keeps its theme color and analytics includes -->
{% include head-custom-theme-colors.html %}
{% include head-custom-google-analytics.html %}

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">

{% comment %} While the blog is switched off (show_blog in _config.yml), send blog URLs to the resume {% endcomment %}
{% if page.blog and site.show_blog != true %}
<meta http-equiv="refresh" content="0; url={{ '/' | relative_url }}">
<meta name="robots" content="noindex">
{% endif %}
